name: BARBATOS Security Scan (Reusable)

# Reusable workflow called from any repository's CI pipeline.
#
# Usage (from caller):
#   jobs:
#     security-scan:
#       uses: dialtone867/barbatos-scanner/.github/workflows/security-scan-reusable.yml@main
#       with:
#         scan_mode: full
#       secrets: inherit

on:
  workflow_call:
    inputs:
      scan_mode:
        description: 'Scan mode (quick/full/nightly/baseline); nightly=full+LLM (Garak)'
        required: false
        default: 'full'
        type: string
      subdirectory:
        description: 'Optional: Subdirectory path to scan'
        required: false
        default: ''
        type: string
      repository_url:
        description: 'Optional: External repository URL to scan (for public/external scans)'
        required: false
        default: ''
        type: string
      pr_number:
        description: 'Optional: Pull request number to scan (GitHub repos, external scan mode)'
        required: false
        default: ''
        type: string
      target_ref:
        description: 'Optional: Branch/tag/commit to scan (external scan mode)'
        required: false
        default: ''
        type: string
      fail_on_critical:
        description: 'Fail build on critical severity findings'
        required: false
        default: true
        type: boolean
      fail_on_high:
        description: 'Fail build on high severity findings'
        required: false
        default: true
        type: boolean
      warning_only:
        description: 'Report vulnerabilities but never fail the build'
        required: false
        default: false
        type: boolean
      garak_target_type:
        description: 'Garak generator type (for example: test, openai, huggingface)'
        required: false
        default: 'openai'
        type: string
      garak_target_name:
        description: 'Garak target model name (for example: test.Blank, gpt-4o-mini)'
        required: false
        default: 'gpt-4o-mini'
        type: string
      garak_probes:
        description: 'Comma-separated Garak probes or probe groups'
        required: false
        default: 'promptinject,dan,knownbadsignatures,encoding,continuation'
        type: string
      skip_garak:
        description: 'Skip Garak LLM security probing (Layer 12)'
        required: false
        default: false
        type: boolean
      run_garak:
        description: 'Explicitly run (true) or skip (false) Garak; when set, overrides skip_garak and event-based defaults'
        required: false
        default: ''
        type: string
      skip_sbom:
        description: 'Skip Layer 1 - SBOM generation'
        required: false
        default: false
        type: boolean
      skip_trufflehog:
        description: 'Skip Layer 2 - Secret detection (TruffleHog)'
        required: false
        default: false
        type: boolean
      skip_sonar:
        description: 'Skip Layer 3 - Code quality (SonarQube)'
        required: false
        default: false
        type: boolean
      skip_clamav:
        description: 'Skip Layer 4 - Malware detection (ClamAV)'
        required: false
        default: false
        type: boolean
      skip_helm:
        description: 'Skip Layer 5 - Helm chart build'
        required: false
        default: false
        type: boolean
      skip_checkov:
        description: 'Skip Layer 6 - Infrastructure security (Checkov)'
        required: false
        default: false
        type: boolean
      skip_trivy:
        description: 'Skip Layer 7 - Container security (Trivy)'
        required: false
        default: false
        type: boolean
      skip_grype:
        description: 'Skip Layer 8 - Vulnerability detection (Grype)'
        required: false
        default: false
        type: boolean
      skip_xeol:
        description: 'Skip Layer 9 - End-of-life detection (Xeol)'
        required: false
        default: false
        type: boolean
      skip_anchore:
        description: 'Skip Layer 10 - Anchore security'
        required: false
        default: false
        type: boolean
      skip_api_discovery:
        description: 'Skip Layer 11 - API discovery'
        required: false
        default: false
        type: boolean
      create_github_issue:
        description: 'Create a GitHub issue for critical and high severity findings'
        required: false
        default: true
        type: boolean
      barbatos_callback_url:
        description: 'SRTM-tool webhook URL to POST scan results back to (omit for standalone use)'
        required: false
        default: ''
        type: string
      barbatos_job_id:
        description: 'Job ID issued by SRTM-tool security-scan-trigger (passed through from workflow_dispatch)'
        required: false
        default: ''
        type: string
      barbatos_webhook_secret:
        description: 'Shared secret for SRTM-tool webhook validation'
        required: false
        default: ''
        type: string
    secrets:
      OPENAI_API_KEY:
        description: 'OpenAI API key for Garak LLM security probing'
        required: false
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key for Garak LLM security probing'
        required: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-scan:
    name: Run BARBATOS Security Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      pull-requests: write
      security-events: write
      issues: write

    env:
      SCAN_MODE: "${{ inputs.scan_mode }}"
      FAIL_ON_CRITICAL: "${{ inputs.fail_on_critical }}"
      FAIL_ON_HIGH: "${{ inputs.fail_on_high }}"
      WARNING_ONLY: "${{ inputs.warning_only }}"
      NOTIFY_USERS: "${{ vars.NOTIFY_USERS }}"
      GARAK_TARGET_TYPE: "${{ inputs.garak_target_type }}"
      GARAK_TARGET_NAME: "${{ inputs.garak_target_name }}"
      GARAK_PROBES: "${{ inputs.garak_probes }}"
      GARAK_TIMEOUT: "300"
      GARAK_GENERATIONS: "5"
      SKIP_GARAK: "${{ inputs.skip_garak }}"
      RUN_GARAK: "${{ inputs.run_garak }}"
      SKIP_SBOM: "${{ inputs.skip_sbom }}"
      SKIP_TRUFFLEHOG: "${{ inputs.skip_trufflehog }}"
      SKIP_SONAR: "${{ inputs.skip_sonar }}"
      SKIP_CLAMAV: "${{ inputs.skip_clamav }}"
      SKIP_HELM: "${{ inputs.skip_helm }}"
      SKIP_CHECKOV: "${{ inputs.skip_checkov }}"
      SKIP_TRIVY: "${{ inputs.skip_trivy }}"
      SKIP_GRYPE: "${{ inputs.skip_grype }}"
      SKIP_XEOL: "${{ inputs.skip_xeol }}"
      SKIP_ANCHORE: "${{ inputs.skip_anchore }}"
      SKIP_API_DISCOVERY: "${{ inputs.skip_api_discovery }}"
      CREATE_GITHUB_ISSUE: "${{ inputs.create_github_issue }}"
      BARBATOS_CALLBACK_URL: "${{ inputs.barbatos_callback_url }}"
      BARBATOS_JOB_ID: "${{ inputs.barbatos_job_id }}"
      BARBATOS_WEBHOOK_SECRET: "${{ inputs.barbatos_webhook_secret }}"

    steps:
      - name: Checkout Target Repository
        if: inputs.repository_url == ''
        uses: actions/checkout@v5
        with:
          path: target-repo
          fetch-depth: 0

      - name: Clone External Target Repository
        if: inputs.repository_url != ''
        run: |
          REPO_URL="${{ inputs.repository_url }}"
          SUBDIR="${{ inputs.subdirectory }}"
          PR_NUMBER="${{ inputs.pr_number }}"
          TARGET_REF="${{ inputs.target_ref }}"
          CHECKOUT_TARGET=""

          if [[ -n "$PR_NUMBER" ]]; then
            CHECKOUT_TARGET="refs/pull/${PR_NUMBER}/merge"
            echo "🎯 Targeting PR #$PR_NUMBER ($CHECKOUT_TARGET)"
          elif [[ -n "$TARGET_REF" ]]; then
            CHECKOUT_TARGET="$TARGET_REF"
            echo "🎯 Targeting ref: $TARGET_REF"
          fi

          if [[ -n "$SUBDIR" ]]; then
            echo "📥 Cloning repository with sparse-checkout (subdirectory: $SUBDIR)"
            git clone --filter=blob:none --sparse "$REPO_URL" target-repo
            cd target-repo

            if [[ -n "$CHECKOUT_TARGET" ]]; then
              git fetch origin "$CHECKOUT_TARGET"
              git checkout --detach FETCH_HEAD
            fi

            git sparse-checkout set "$SUBDIR"
            cd ..
          else
            echo "📥 Cloning full repository"
            git clone "$REPO_URL" target-repo
            if [[ -n "$CHECKOUT_TARGET" ]]; then
              cd target-repo
              git fetch origin "$CHECKOUT_TARGET"
              git checkout --detach FETCH_HEAD
              cd ..
            fi
          fi

      - name: Checkout BARBATOS Security Scanner
        uses: actions/checkout@v5
        with:
          repository: dialtone867/barbatos-scanner
          path: barbatos
          fetch-depth: 1

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3 python3-pip bats
          pip3 install pyyaml pipdeptree

      - name: Initialize Scan
        id: init-scan
        env:
          TARGET_NAME: ${{ github.event.repository.name }}
          GITHUB_ACTOR: ${{ github.actor }}
          SUBDIR: ${{ inputs.subdirectory }}
          REPOSITORY_URL_INPUT: ${{ inputs.repository_url }}
        run: |
          cd barbatos
          chmod +x scripts/shell/run-target-security-scan.sh

          BARBATOS_VERSION=$(tr -d '[:space:]' < VERSION 2>/dev/null || echo "unknown")
          echo "Using BARBATOS scanner version: $BARBATOS_VERSION"

          TARGET_NAME_DEFAULT="$TARGET_NAME"
          if [[ -n "$REPOSITORY_URL_INPUT" ]]; then
            TARGET_NAME_DEFAULT=$(basename "$REPOSITORY_URL_INPUT" .git)
          fi

          if [[ -n "$SUBDIR" ]]; then
            TARGET_DIR="${{ github.workspace }}/target-repo/$SUBDIR"
            TARGET_NAME=$(basename "$SUBDIR")
            echo "🎯 Scanning subdirectory: $SUBDIR"
          else
            TARGET_DIR="${{ github.workspace }}/target-repo"
            TARGET_NAME="$TARGET_NAME_DEFAULT"
            echo "🎯 Scanning full repository: $TARGET_NAME"
          fi

          echo "TARGET_DIR=$TARGET_DIR" > /tmp/barbatos-env
          echo "SCAN_MODE=$SCAN_MODE" >> /tmp/barbatos-env
          echo "TARGET_NAME=$TARGET_NAME" >> /tmp/barbatos-env
          echo "GITHUB_ACTOR=$GITHUB_ACTOR" >> /tmp/barbatos-env
          echo "SUBDIR=$SUBDIR" >> /tmp/barbatos-env
          echo "BARBATOS_VERSION=$BARBATOS_VERSION" >> /tmp/barbatos-env
          echo "GARAK_TARGET_TYPE=${GARAK_TARGET_TYPE:-openai}" >> /tmp/barbatos-env
          echo "GARAK_TARGET_NAME=${GARAK_TARGET_NAME:-gpt-4o-mini}" >> /tmp/barbatos-env
          echo "GARAK_PROBES=${GARAK_PROBES:-promptinject,dan,knownbadsignatures,encoding,continuation}" >> /tmp/barbatos-env

          # Per-tool skip flags
          echo "SKIP_SBOM=${SKIP_SBOM:-false}" >> /tmp/barbatos-env
          echo "SKIP_TRUFFLEHOG=${SKIP_TRUFFLEHOG:-false}" >> /tmp/barbatos-env
          echo "SKIP_SONAR=${SKIP_SONAR:-false}" >> /tmp/barbatos-env
          echo "SKIP_CLAMAV=${SKIP_CLAMAV:-false}" >> /tmp/barbatos-env
          echo "SKIP_HELM=${SKIP_HELM:-false}" >> /tmp/barbatos-env
          echo "SKIP_CHECKOV=${SKIP_CHECKOV:-false}" >> /tmp/barbatos-env
          echo "SKIP_TRIVY=${SKIP_TRIVY:-false}" >> /tmp/barbatos-env
          echo "SKIP_GRYPE=${SKIP_GRYPE:-false}" >> /tmp/barbatos-env
          echo "SKIP_XEOL=${SKIP_XEOL:-false}" >> /tmp/barbatos-env
          echo "SKIP_ANCHORE=${SKIP_ANCHORE:-false}" >> /tmp/barbatos-env
          echo "SKIP_API_DISCOVERY=${SKIP_API_DISCOVERY:-false}" >> /tmp/barbatos-env

          # Propagate RUN_GARAK to SKIP_GARAK for legacy consumers; run_garak_layer reads RUN_GARAK directly.
          if [[ "${RUN_GARAK}" == "true" ]];  then echo "SKIP_GARAK=false" >> "$GITHUB_ENV"; fi
          if [[ "${RUN_GARAK}" == "false" ]]; then echo "SKIP_GARAK=true"  >> "$GITHUB_ENV"; fi

          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          SCAN_NAME="${TARGET_NAME}_${TIMESTAMP}"
          SCAN_DIR="scans/${SCAN_NAME}"
          mkdir -p "$SCAN_DIR"
          echo "SCAN_DIR=$PWD/$SCAN_DIR" >> /tmp/barbatos-env
          echo "SCAN_NAME=$SCAN_NAME" >> /tmp/barbatos-env
          echo "SCAN_ID=$SCAN_NAME" >> /tmp/barbatos-env
          echo "scan_dir=$SCAN_DIR" >> $GITHUB_OUTPUT
          echo "scan_id=$SCAN_NAME" >> $GITHUB_OUTPUT
          echo "🚀 Initialized scan: $SCAN_NAME"

      - name: Run Security Layers (CI Orchestrator)
        id: run-scan
        continue-on-error: true
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_PR_NUMBER: ${{ github.event.pull_request.number }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANCHORE_BUILD_TIMEOUT: "900"
          ANCHORE_SKIP_BUILD: "true"
        run: |
          # Append API keys to /tmp/barbatos-env so they are explicitly exported to all subshells.
          [[ -n "${OPENAI_API_KEY:-}" ]]    && echo "OPENAI_API_KEY=${OPENAI_API_KEY}"       >> /tmp/barbatos-env
          [[ -n "${ANTHROPIC_API_KEY:-}" ]] && echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}" >> /tmp/barbatos-env
          chmod +x barbatos/scripts/shell/run-barbatos-scan-ci.sh
          ./barbatos/scripts/shell/run-barbatos-scan-ci.sh

      - name: Check Severity Gate
        run: |
          cd barbatos
          if [ -f /tmp/barbatos-env ]; then
            set -a
            source /tmp/barbatos-env
            set +a
          fi
          export FAIL_ON_CRITICAL="${{ env.FAIL_ON_CRITICAL }}"
          export FAIL_ON_HIGH="${{ env.FAIL_ON_HIGH }}"
          export WARNING_ONLY="${{ env.WARNING_ONLY }}"
          chmod +x scripts/shell/check-severity-gate.sh
          ./scripts/shell/check-severity-gate.sh

      - name: Generate Reports & Dashboard
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd barbatos
          if [ -f /tmp/barbatos-env ]; then
            source /tmp/barbatos-env
          fi
          SCAN_DIR="${{ steps.init-scan.outputs.scan_dir }}"
          echo "📊 Generating consolidated reports and dashboard..."
          echo "DEBUG: SCAN_DIR = $SCAN_DIR"
          echo "DEBUG: Before consolidation, manifest files:"
          ls -la "$SCAN_DIR"/scan-manifest* "$SCAN_DIR"/manifest-summary* 2>&1 || echo "Manifest files not found before consolidation!"
          chmod +x scripts/shell/consolidate-security-reports.sh
          SCAN_DIR="$SCAN_DIR" TARGET_DIR="$TARGET_DIR" ./scripts/shell/consolidate-security-reports.sh || echo "Report generation completed with warnings"

      - name: Fix Artifact Permissions
        if: always()
        run: |
          cd barbatos
          SCAN_DIR="${{ steps.init-scan.outputs.scan_dir }}"
          if [ -d "$SCAN_DIR" ]; then
            echo "Fixing permissions for: $SCAN_DIR"
            sudo chown -R runner:docker "$SCAN_DIR" || true
            sudo chmod -R a+r "$SCAN_DIR" || true
            sudo find "$SCAN_DIR" -type d -exec chmod a+rx {} \; || true
            if [ -d "$SCAN_DIR/clamav" ]; then
              ls -la "$SCAN_DIR/clamav/"
            fi
          fi

      - name: Generate Summary
        if: always()
        run: |
          cd barbatos
          if [ -f /tmp/barbatos-env ]; then
            source /tmp/barbatos-env
          fi
          SCAN_DIR="${{ steps.init-scan.outputs.scan_dir }}"
          GARAK_RESULTS_FILE="$SCAN_DIR/garak/garak-results.json"

          echo "**BARBATOS Version:** \`${BARBATOS_VERSION:-unknown}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🤖 Garak LLM Scan" >> $GITHUB_STEP_SUMMARY
          if [ -f "$GARAK_RESULTS_FILE" ]; then
            GARAK_STATUS=$(jq -r '.status // "unknown"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "unknown")
            GARAK_TARGET_TYPE=$(jq -r '.target_type // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_TARGET_NAME=$(jq -r '.target_name // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_RUNTIME_TARGET=$(jq -r '.runtime_target // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_RUNTIME_CLASSIFICATION=$(jq -r '.runtime_classification // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_TARGET_ORIGIN=$(jq -r '.target_origin // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_PROBES=$(jq -r '.probes // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_EXIT_CODE=$(jq -r '.exit_code // "n/a"' "$GARAK_RESULTS_FILE" 2>/dev/null || echo "n/a")
            GARAK_HIT_LOG=$(jq -r '.hit_log // empty' "$GARAK_RESULTS_FILE" 2>/dev/null || true)
            GARAK_HIT_COUNT="0"
            if [ -n "$GARAK_HIT_LOG" ] && [ -f "$SCAN_DIR/garak/$GARAK_HIT_LOG" ]; then
              GARAK_HIT_COUNT=$(wc -l < "$SCAN_DIR/garak/$GARAK_HIT_LOG" | tr -d '[:space:]')
            fi
            echo "- Status: \`$GARAK_STATUS\`" >> $GITHUB_STEP_SUMMARY
            echo "- Target: \`$GARAK_TARGET_TYPE\` / \`$GARAK_TARGET_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "- Runtime target: \`$GARAK_RUNTIME_TARGET\`" >> $GITHUB_STEP_SUMMARY
            echo "- Runtime class: \`$GARAK_RUNTIME_CLASSIFICATION\`" >> $GITHUB_STEP_SUMMARY
            echo "- Target origin: \`$GARAK_TARGET_ORIGIN\`" >> $GITHUB_STEP_SUMMARY
            echo "- Probes: \`$GARAK_PROBES\`" >> $GITHUB_STEP_SUMMARY
            echo "- Probe hits: \`$GARAK_HIT_COUNT\`" >> $GITHUB_STEP_SUMMARY
            echo "- Exit code: \`$GARAK_EXIT_CODE\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Garak results were not generated in this run." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "$SCAN_DIR/consolidated-reports/markdown-reports/executive-summary.md" ]; then
            cat "$SCAN_DIR/consolidated-reports/markdown-reports/executive-summary.md" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Complete Scan Results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ${{ steps.init-scan.outputs.scan_id }}
          path: barbatos/${{ steps.init-scan.outputs.scan_dir }}/
          retention-days: 30

      - name: Check for Critical/High Vulnerabilities
        id: check-severity
        if: always()
        run: |
          cd barbatos
          SCAN_DIR="${{ steps.init-scan.outputs.scan_dir }}"

          # Default outputs — always written so downstream steps are never skipped due to empty outputs
          CRITICAL=0
          HIGH=0
          MEDIUM=0
          LOW=0

          # Prefer the filtered JSON (suppressed tools removed) if it exists, then the
          # deduplicated full summary, then executive-summary.md as a last resort.
          FILTERED_JSON="$SCAN_DIR/security-findings-filtered.json"
          FINDINGS_JSON="$SCAN_DIR/security-findings-summary.json"
          ACTIVE_JSON="$FINDINGS_JSON"
          if [ -f "$FILTERED_JSON" ]; then
            ACTIVE_JSON="$FILTERED_JSON"
            echo "DEBUG: Using filtered findings (suppressed tools excluded): $FILTERED_JSON"
          fi
          if [ -f "$ACTIVE_JSON" ]; then
            CRITICAL=$(jq -r '.summary.total_critical // 0' "$ACTIVE_JSON")
            HIGH=$(jq -r '.summary.total_high // 0' "$ACTIVE_JSON")
            MEDIUM=$(jq -r '.summary.total_medium // 0' "$ACTIVE_JSON")
            LOW=$(jq -r '.summary.total_low // 0' "$ACTIVE_JSON")
            echo "DEBUG: Read from $(basename $ACTIVE_JSON) — Critical=$CRITICAL High=$HIGH Medium=$MEDIUM Low=$LOW"
          else
            # Fall back to executive-summary.md
            SUMMARY="$SCAN_DIR/consolidated-reports/markdown-reports/executive-summary.md"
            if [ -f "$SUMMARY" ]; then
              CRITICAL=$(grep -oP 'Critical:\s*\K\d+' "$SUMMARY" | head -1 || echo "0")
              HIGH=$(grep -oP 'High:\s*\K\d+' "$SUMMARY" | head -1 || echo "0")
              MEDIUM=$(grep -oP 'Medium:\s*\K\d+' "$SUMMARY" | head -1 || echo "0")
              LOW=$(grep -oP 'Low:\s*\K\d+' "$SUMMARY" | head -1 || echo "0")
              CRITICAL=${CRITICAL:-0}
              HIGH=${HIGH:-0}
              MEDIUM=${MEDIUM:-0}
              LOW=${LOW:-0}
              echo "DEBUG: Read from executive-summary.md — Critical=$CRITICAL High=$HIGH Medium=$MEDIUM Low=$LOW"
            else
              echo "WARNING: Neither security-findings-summary.json nor executive-summary.md found in $SCAN_DIR"
              echo "DEBUG: Contents of $SCAN_DIR:"
              ls -la "$SCAN_DIR" 2>/dev/null || echo "(directory not found)"
            fi
          fi

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "medium=$MEDIUM" >> $GITHUB_OUTPUT
          echo "low=$LOW" >> $GITHUB_OUTPUT

          if [ "${CRITICAL:-0}" -gt 0 ] || [ "${HIGH:-0}" -gt 0 ] || [ "${MEDIUM:-0}" -gt 0 ] || [ "${LOW:-0}" -gt 0 ]; then
            echo "has_issues=true" >> $GITHUB_OUTPUT
          else
            echo "has_issues=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'barbatos/${{ steps.init-scan.outputs.scan_dir }}/consolidated-reports/markdown-reports/executive-summary.md';

            if (fs.existsSync(summaryPath)) {
              const summary = fs.readFileSync(summaryPath, 'utf8');
              const critical = parseInt('${{ steps.check-severity.outputs.critical }}' || '0');
              const high = parseInt('${{ steps.check-severity.outputs.high }}' || '0');
              const medium = parseInt('${{ steps.check-severity.outputs.medium }}' || '0');
              const low = parseInt('${{ steps.check-severity.outputs.low }}' || '0');

              let emoji = '✅';
              let status = 'No security issues found';

              if (critical > 0 || high > 0) {
                emoji = '⚠️';
                status = `Found ${critical} critical and ${high} high severity issues`;
              } else if (medium > 0 || low > 0) {
                emoji = '🟡';
                status = `Found ${medium} medium and ${low} low severity issues`;
              }

              const notifyUsers = '${{ env.NOTIFY_USERS }}'.split(',').map(u => `@${u.trim()}`).join(' ');

              // Build skipped-scans list from SKIP_* env vars
              const skipMap = {
                'Garak LLM':      '${{ env.SKIP_GARAK }}' === 'true',
                'SBOM':           '${{ env.SKIP_SBOM }}' === 'true',
                'TruffleHog':     '${{ env.SKIP_TRUFFLEHOG }}' === 'true',
                'SonarQube':      '${{ env.SKIP_SONAR }}' === 'true',
                'ClamAV':         '${{ env.SKIP_CLAMAV }}' === 'true',
                'Helm':           '${{ env.SKIP_HELM }}' === 'true',
                'Checkov':        '${{ env.SKIP_CHECKOV }}' === 'true',
                'Trivy':          '${{ env.SKIP_TRIVY }}' === 'true',
                'Grype':          '${{ env.SKIP_GRYPE }}' === 'true',
                'Xeol':           '${{ env.SKIP_XEOL }}' === 'true',
                'Anchore':        '${{ env.SKIP_ANCHORE }}' === 'true',
                'API Discovery':  '${{ env.SKIP_API_DISCOVERY }}' === 'true',
              };
              const skippedScans = Object.entries(skipMap).filter(([,v]) => v).map(([k]) => k);
              const skippedSection = skippedScans.length > 0
                ? `\n> ⏭️ **Skipped scans:** ${skippedScans.join(', ')}\n`
                : '';

              const comment = `## ${emoji} BARBATOS Security Scan Results

              ${status}
              ${skippedSection}
              **Triggered by:** ${{ github.actor }}
              **Notifying:** ${notifyUsers}

              <details>
              <summary>📊 Executive Summary</summary>

              ${summary}

              </details>

              ### 📦 Artifacts
              - [Security Dashboard](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              - [HTML Reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              - [Markdown Reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              `;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

      - name: Create Scan Notification Issues
        id: create-github-issue
        if: always() && steps.check-severity.outputs.has_issues == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // ── Only @mention users listed in NOTIFY_USERS — never broader team mentions ──
            const notifyMentions = ('${{ env.NOTIFY_USERS }}' || '')
              .split(',').map(u => u.trim()).filter(Boolean).map(u => `@${u}`).join(' ');

            const triggeredBy  = '${{ github.actor }}'; // username only — no @ to avoid notifying actor
            const repository   = '${{ github.repository }}';
            const repoName     = repository.split('/')[1];
            const scanMode     = '${{ env.SCAN_MODE }}';
            const runUrl       = `https://github.com/${repository}/actions/runs/${{ github.run_id }}`;
            const today        = new Date().toISOString().split('T')[0];

            const critical = parseInt('${{ steps.check-severity.outputs.critical }}') || 0;
            const high     = parseInt('${{ steps.check-severity.outputs.high }}')     || 0;
            const medium   = parseInt('${{ steps.check-severity.outputs.medium }}')   || 0;
            const low      = parseInt('${{ steps.check-severity.outputs.low }}')      || 0;

            // ── Load the findings JSON produced by the scan ─────────────────────────────
            // Prefer the filtered version (suppressed tools removed) if it exists.
            const filteredPath = 'barbatos/${{ steps.init-scan.outputs.scan_dir }}/security-findings-filtered.json';
            const findingsPath = 'barbatos/${{ steps.init-scan.outputs.scan_dir }}/security-findings-summary.json';
            const activePath = fs.existsSync(filteredPath) ? filteredPath : findingsPath;
            let findingsData = {};
            if (fs.existsSync(activePath)) {
              try { findingsData = JSON.parse(fs.readFileSync(activePath, 'utf8')); }
              catch (e) { console.warn(`Could not parse findings JSON: ${e.message}`); }
            }

            // ── Per-severity config: one GitHub issue is maintained per severity level ─
            const SEVERITIES = [
              { key: 'critical', label: 'critical',        emoji: '🔴', count: critical, findingsKey: 'critical_findings', labelName: 'Critical' },
              { key: 'high',     label: 'high-severity',   emoji: '🟠', count: high,     findingsKey: 'high_findings',     labelName: 'High'     },
              { key: 'medium',   label: 'medium-severity', emoji: '🟡', count: medium,   findingsKey: 'medium_findings',   labelName: 'Medium'   },
              { key: 'low',      label: 'low-severity',    emoji: '🔵', count: low,      findingsKey: 'low_findings',      labelName: 'Low'      },
            ];

            // The tracking marker is an invisible HTML comment embedded in issue/comment
            // bodies so we can tell which vulnerability IDs were previously reported.
            function extractStoredVulnIds(body) {
              if (!body) return [];
              const m = body.match(/<!--barbatos-vuln-ids:([\s\S]*?)-->/);
              if (!m) return [];
              try { return JSON.parse(m[1]); } catch { return []; }
            }

            function findingId(f) {
              return f.vulnerability_id || f.check_id || f.detector || 'unknown';
            }

            function buildFindingsTable(sevFindings) {
              if (!sevFindings || sevFindings.length === 0) return '_No findings._';
              const header = '| ID / CVE | Package / File | Version | Tool | Description |\n|----------|----------------|---------|------|-------------|';
              const rows = sevFindings.map(f => {
                const id   = findingId(f);
                const pkg  = (f.package_name || f.file_path || f.file || 'N/A').substring(0, 60);
                const ver  = f.package_version || '-';
                const tool = f.tool || 'N/A';
                const desc = (f.description || '').substring(0, 100);
                const kev  = f.cisa_kev ? ' 🔥 KEV' : '';
                return `| \`${id}\`${kev} | ${pkg} | ${ver} | ${tool} | ${desc} |`;
              });
              return `${header}\n${rows.join('\n')}`;
            }

            function buildIssueBody(sev, sevFindings, vulnIds) {
              let triggerLabel = 'Manual';
              if ('${{ github.event_name }}' === 'schedule')         triggerLabel = 'Scheduled Scan';
              else if ('${{ github.event_name }}' === 'push')        triggerLabel = 'Push to ${{ github.ref_name }}';
              else if ('${{ github.event_name }}' === 'pull_request') triggerLabel = 'Pull Request #${{ github.event.pull_request.number }}';
              const steps = (sev.key === 'critical' || sev.key === 'high')
                ? '1. ⚠️ **Review these findings immediately**\n2. Download the security dashboard from the workflow run\n3. Prioritize remediation by severity'
                : '1. Review scan results\n2. Keep dependencies up to date';
              return [
                `${sev.emoji} **[BARBATOS] ${sev.labelName} Security Findings**`,
                '',
                `**Repository:** \`${repository}\``,
                `**Scan Mode:** \`${scanMode}\``,
                `**Trigger:** ${triggerLabel}`,
                `**Triggered by:** ${triggeredBy}`,
                notifyMentions ? `**Notifying:** ${notifyMentions}` : '',
                '',
                '---',
                '',
                `### 📊 ${sev.labelName} Severity Findings (${sev.count})`,
                '',
                buildFindingsTable(sevFindings),
                '',
                '---',
                '',
                '### 🔗 Resources',
                `- [View Workflow Run](${runUrl})`,
                '',
                '### 🔧 Next Steps',
                steps,
                '',
                '---',
                `*🤖 Automated notification from BARBATOS Security Scanner — first reported ${today}*`,
                '',
                `<!--barbatos-vuln-ids:${JSON.stringify(vulnIds)}-->`,
              ].filter(l => l !== null).join('\n');
            }

            function buildUpdateComment(sev, newFindings, allCurrentVulnIds) {
              return [
                `### 🔄 New ${sev.labelName} Findings — ${today}`,
                '',
                `${newFindings.length} new vulnerability/vulnerabilities detected since last scan:`,
                '',
                buildFindingsTable(newFindings),
                '',
                `[View Workflow Run](${runUrl}) · Triggered by ${triggeredBy}`,
                notifyMentions ? `\n**Notifying:** ${notifyMentions}` : '',
                '',
                `<!--barbatos-vuln-ids:${JSON.stringify(allCurrentVulnIds)}-->`,
              ].filter(l => l !== null).join('\n');
            }

            // ── Process each severity level independently ─────────────────────────────
            let firstIssueNumber = '';
            let firstIssueUrl    = '';

            for (const sev of SEVERITIES) {
              if (sev.count === 0) continue;

              const sevFindings    = findingsData[sev.findingsKey] || [];
              const currentVulnIds = [...new Set(sevFindings.map(findingId))];

              // Search for an existing open issue for this exact severity level.
              const { data: existingList } = await github.rest.issues.listForRepo({
                owner:    context.repo.owner,
                repo:     context.repo.repo,
                state:    'open',
                labels:   `security-scan,barbatos,${sev.label}`,
                per_page: 1,
              });

              if (existingList.length > 0) {
                const issue = existingList[0];

                // Extract the set of previously tracked vuln IDs from the most recent
                // bot comment, or fall back to the issue body if no comments exist yet.
                const { data: comments } = await github.rest.issues.listComments({
                  owner:        context.repo.owner,
                  repo:         context.repo.repo,
                  issue_number: issue.number,
                  per_page:     100,
                });
                const botComments = comments.filter(c => c.user.type === 'Bot').reverse();
                const lastBody    = botComments.length > 0 ? botComments[0].body : issue.body;
                const prevVulnIds = extractStoredVulnIds(lastBody);

                // Only post a comment when there are vulnerability IDs not yet reported.
                const newVulnIds = currentVulnIds.filter(id => !prevVulnIds.includes(id));
                if (newVulnIds.length === 0) {
                  console.log(`[${sev.key}] No new vulnerabilities (${currentVulnIds.length} already tracked) — skipping`);
                  if (!firstIssueNumber) { firstIssueNumber = String(issue.number); firstIssueUrl = issue.html_url; }
                  continue;
                }

                console.log(`[${sev.key}] ${newVulnIds.length} new vuln(s) — commenting on #${issue.number}`);
                const newFindings = sevFindings.filter(f => newVulnIds.includes(findingId(f)));
                await github.rest.issues.createComment({
                  owner:        context.repo.owner,
                  repo:         context.repo.repo,
                  issue_number: issue.number,
                  body:         buildUpdateComment(sev, newFindings, currentVulnIds),
                });
                if (!firstIssueNumber) { firstIssueNumber = String(issue.number); firstIssueUrl = issue.html_url; }

              } else {
                // No open issue for this severity — create one now.
                console.log(`[${sev.key}] No existing open issue — creating`);
                const body = buildIssueBody(sev, sevFindings, currentVulnIds);
                const { data: newIssue } = await github.rest.issues.create({
                  owner:  context.repo.owner,
                  repo:   context.repo.repo,
                  title:  `${sev.emoji} [BARBATOS] ${sev.labelName} Security Findings — ${repoName}`,
                  body,
                  labels: ['security-scan', 'barbatos', sev.label, 'security'],
                });
                console.log(`[${sev.key}] Created issue #${newIssue.number}: ${newIssue.html_url}`);
                if (!firstIssueNumber) { firstIssueNumber = String(newIssue.number); firstIssueUrl = newIssue.html_url; }
              }
            }

            if (firstIssueNumber) {
              core.setOutput('issue_number', firstIssueNumber);
              core.setOutput('issue_url', firstIssueUrl);
            }

      - name: Post Results to SRTM-tool
        if: always() && env.BARBATOS_CALLBACK_URL != ''
        env:
          SCAN_DIR_PATH: barbatos/${{ steps.init-scan.outputs.scan_dir }}
        run: |
          JOB_ID="${BARBATOS_JOB_ID}"
          SECRET="${BARBATOS_WEBHOOK_SECRET}"
          URL="${BARBATOS_CALLBACK_URL}"
          HEADERS=(-H "X-Barbatos-Job-Id: ${JOB_ID}")
          [[ -n "$SECRET" ]] && HEADERS+=(-H "X-Barbatos-Secret: ${SECRET}")
          HEADERS+=(-H "Content-Type: application/json")

          post_tool() {
            local tool="$1" file="$2"
            if [[ -f "$file" ]]; then
              echo "📤 Posting ${tool} results to SRTM-tool..."
              content=$(cat "$file")
              payload=$(jq -cn --arg tool "$tool" --argjson content "$content" '{tool: $tool, content: $content}')
              http_code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${URL}" "${HEADERS[@]}" -d "$payload" || echo "000")
              echo "   → HTTP ${http_code}"
            fi
          }

          post_tool grype        "${SCAN_DIR_PATH}/grype/grype-filesystem-results.json"
          post_tool trivy        "${SCAN_DIR_PATH}/trivy/trivy-filesystem-results.json"
          post_tool trufflehog   "${SCAN_DIR_PATH}/trufflehog/trufflehog-results.json"
          post_tool checkov      "${SCAN_DIR_PATH}/checkov/checkov-results.json"
          post_tool xeol         "${SCAN_DIR_PATH}/xeol/xeol-results.json"
          post_tool syft         "${SCAN_DIR_PATH}/sbom/sbom-results.json"
          post_tool anchore      "${SCAN_DIR_PATH}/anchore/anchore-results.json"

          # Send done signal
          echo "📤 Sending done signal to SRTM-tool..."
          curl -s -o /dev/null -w "done → HTTP %{http_code}\n" -X POST "${URL}" "${HEADERS[@]}" \
            -d '{"done":true}' || true

      - name: Fail on Critical Vulnerabilities
        if: always() && steps.check-severity.outputs.critical > 0
        run: |
          echo "::error::Found ${{ steps.check-severity.outputs.critical }} critical vulnerabilities"
          exit 1
